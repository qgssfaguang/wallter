apply plugin: 'com.android.application'

android {
    namespace "com.cardwallet.manager"
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.cardwallet.manager"
        minSdkVersion 22
        targetSdkVersion 34
        versionCode 10
        versionName "4.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.coordinatorlayout:coordinatorlayout:1.2.0"
    implementation "androidx.core:core-splashscreen:1.0.1"
    implementation 'com.capacitorjs:core:6.0.0'
    // Bundled On-Device Offline OCR (Google ML Kit Chinese & Latin Text Recognition - 100% offline, no cloud upload)
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.0'
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
}
